[[decisions]]
id = "ADR-015"
date = "2026-10-09"
title = "Hàm public của wallet trả Result, không raise"
decision = "Trả {'ok': bool, 'error': mã trong src/errors.py hoặc None}. Không raise cho lỗi nghiệp vụ. `withdraw` còn raise là legacy chưa migrate, đừng bắt chước."
why = "API gateway map mã lỗi sang thông báo cho người dùng; exception làm lộ stacktrace."

[[decisions]]
id = "ADR-004"
date = "2026-09-28"
title = "Tiền là số nguyên đồng"
decision = "Mọi số tiền là int; số tiền <= 0 là INVALID_AMOUNT."
why = "Đối soát."
