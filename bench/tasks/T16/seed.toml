[[decisions]]
id = "ADR-004"
date = "2026-09-28"
title = "Tiền là số nguyên đồng, làm tròn half-up"
decision = "Mọi số tiền là int (đồng). Tính bằng decimal, làm tròn ROUND_HALF_UP; cấm float và round() của Python."
why = "Đối soát lệch 1 đồng ở .5."

[[decisions]]
id = "ADR-020"
date = "2026-10-11"
title = "Giảm giá tính trên tổng giỏ, làm tròn một lần"
decision = "Áp phần trăm lên tổng giỏ rồi làm tròn một lần; không giảm và làm tròn từng dòng."
why = "Làm tròn từng dòng lệch so với hoá đơn VAT."

[[traps]]
