[[traps]]
id = "M-001"
title = "Chạy test sai thư mục làm import src lỗi"
trigger = ["tests/*", "kw:unittest"]
symptom = "ModuleNotFoundError: No module named 'src'"
fix = "Luôn chạy `python -m unittest discover -s tests -t .` ở thư mục gốc repo."
seen = ["2026-09-22"]

[[traps]]
id = "M-004"
title = "unicodedata NFD không tách được đ/Đ"
trigger = ["src/text.py", "kw:unicodedata"]
symptom = "'Đường' thành 'đuong' thay vì 'duong'"
fix = "Thay `đ`→`d`, `Đ`→`D` thủ công trước khi normalize NFD."
seen = ["2026-08-14", "2026-09-30"]

[[proofs]]
id = "B-003"
behavior = "Hàm xử lý chuỗi trong src/text.py có unit test"
cmd = "python -m unittest tests.test_text"
