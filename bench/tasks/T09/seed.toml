[[decisions]]
id = "ADR-010"
date = "2026-10-08"
title = "Định dạng CSV gửi kế toán"
decision = "Phân cách bằng dấu chấm phẩy `;` (Excel locale VN), mã hoá utf-8-sig (có BOM), ngày dd/mm/yyyy, số tiền là số nguyên đồng không phân cách nghìn."
why = "Excel ở máy kế toán dùng locale vi-VN: dấu phẩy là dấu thập phân."

[[traps]]
id = "M-011"
title = "Excel hiển thị lỗi tiếng Việt khi CSV thiếu BOM"
